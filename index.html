<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typewriter-effect@3/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>Recipes Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Eat healthy. Feel stronger 🌱</h1>
        <p>Personalised recipes for your fitness goals</p>
      </header>

      <main>
        <div class="form-container">
          <form id="recipe-generator-form">
            <input
              type="text"
              placeholder="What's in your fridge?"
              autofocus
              required
              autocomplete="off"
              class="instructions"
              id="user-instructions"
            />

            <div class="recipe-options">
              <div class="option">
                <label for="fitness-goal">Fitness goal 💪🏼</label>
                <select id="fitness-goal">
                  <option value="balanced eating">Balanced eating</option>
                  <option value="muscle gain">Muscle gain</option>
                  <option value="weight management">Weight management</option>
                </select>
              </div>

              <div class="option">
                <label for="cooking-time">Cooking time ⏱️</label>
                <select id="cooking-time">
                  <option value="10">10 minutes</option>
                  <option value="20" selected>20 minutes</option>
                  <option value="30">30 minutes</option>
                </select>
              </div>
            </div>

            <input
              type="submit"
              value="✨ Generate my recipe"
              class="submit-button"
            />
          </form>
          <div class="hint">i.e: Eggs, Pepper, Mushrooms</div>
        </div>
        <div class="recipe hidden" id="recipe"></div>
      </main>
      <footer>
        Coded with 💚 by
        <a href="https://github.com/Noki16-hr" target="_blank"
          >Noelia Jiménez</a
        >
        and is
        <a
          href="https://github.com/Noki16-hr/fitness-recipe-generator"
          target="_blank"
          >open-sourced on GitHub</a
        >
        and is hosted on
        <a href="https://fit-recipe-generator.onrender.com" target="_blank"
          >Render</a
        >
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
